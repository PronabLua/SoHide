name: build

on:
  push:
  pull_request:

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ndk:
          - 24.0.8215888
          - 27.0.12077973
          - 30.0.16248370
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager "ndk;${{ matrix.ndk }}"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/${{ matrix.ndk }}/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
